name: itsm

services:
  mysql:
    image: mysql:8.0
    container_name: itsm-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
      - --innodb-buffer-pool-size=512M
      # ADR: timestamps เก็บเป็น UTC เสมอ แปลง timezone ที่ชั้น application เท่านั้น
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-itsm_root_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-itsm}
      MYSQL_USER: ${MYSQL_USER:-itsm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-itsm_dev}
      TZ: UTC
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # รันครั้งแรกที่ volume ยังว่าง — ให้สิทธิ์ที่ Prisma shadow database ต้องใช้
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-itsm_root_dev}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: itsm-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: itsm-opensearch
    restart: unless-stopped
    environment:
      # โหมด single node สำหรับ dev เท่านั้น — production ต้องเปิด security plugin
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: itsm-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-itsm}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-itsm_dev_secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    # จับอีเมลขาออกทั้งหมดในระหว่างพัฒนา — ไม่ให้หลุดออกไปจริง
    image: axllent/mailpit:latest
    container_name: itsm-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  mysql-data:
  redis-data:
  opensearch-data:
  minio-data:
